<title>Ali Sellaouti – e-portfolio</title>
<style>
:root{--bg:#0b0e1a;--bg2:#111629;--card:#151b33;--ink:#e8ecf8;--mut:#8b95b5;--acc:#4ee0c1;--acc2:#7c8cff;--warm:#ff9d4d;--line:#242c4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#1b2352 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#0b0e1acc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
nav{display:flex;gap:2px;overflow-x:auto;padding:8px 12px;max-width:1000px;margin:auto;align-items:center}
nav a{white-space:nowrap;padding:8px 12px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px}
nav a.on{color:var(--acc);background:#4ee0c11a}
nav button{margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
main{max-width:1000px;margin:auto;padding:28px 16px 64px}
section{display:none}section.on{display:block;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;margin:.1em 0;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.8rem;margin:0 0 6px}h3{margin:0 0 6px}
.kick{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--acc);font-size:14px}
.lead{color:var(--mut);max-width:640px;font-size:1.1rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero .ph{order:-1}}
.ph{width:170px;height:170px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.term{margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:13.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#c9d3f5;overflow-x:auto}
.term b{color:var(--acc)}.term i{color:var(--warm);font-style:normal}
.cur{display:inline-block;width:8px;height:15px;background:var(--acc);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:2.1rem;line-height:1.1;color:var(--acc)}.stat span{color:var(--mut);font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.todo{border-style:dashed;background:transparent;color:var(--mut)}
.card p{margin:.3em 0}.mut{color:var(--mut)}
.btn{display:inline-block;margin:10px 10px 0 0;padding:10px 18px;border-radius:10px;background:var(--acc);color:#07111a;text-decoration:none;font-weight:700}
.btn.o{background:none;border:1.5px solid var(--acc);color:var(--acc)}
.fig{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.fig svg{width:100%;height:auto;display:block}.fig small{color:var(--mut)}
.q{border-left:3px solid var(--acc);padding:4px 0 4px 16px;color:#c9d3f5;font-size:1.1rem;margin:18px 0}
</style>
</head>
